/* Layout: 독서대(reading desk) 위에 펼쳐진 한 권. 상단 고정 툴바 + 화면 높이에 맞춘 책 + 하단 페이지 슬라이더 */
:root{

  --shadow:0 18px 60px rgba(0,0,0,.6); --page-dim:.88; color-scheme:dark}}
:root[data-theme="dark"]{

  --ink:#ecebe8; --ink-2:#b2b4ba; --ink-3:#80848c; --paper:#2a2d33; --paper-line:#3a3e46;
  --accent:#c9aebc; --btn:#2b2f36; --btn-on:#c9aebc; --btn-on-ink:#16181c;

.cover .tag{padding:0 44px;font-size:16px;color:var(--cover-mute);margin-top:4px}
.cover ol{list-style:none;margin:30px 44px 0;padding:0;display:grid;gap:16px}

.cover li em{font-style:normal;font-size:13px;color:var(--cover-hi);font-weight:600;letter-spacing:.04em}
.cover li span{font-family:var(--f-display);font-size:18px;line-height:1.4;font-weight:700;text-wrap:balance}
.cover .pub{margin-top:auto;padding:0 44px 34px;font-size:13.5px;color:var(--cover-mute);display:flex;justify-content:space-between;align-items:flex-end}
.cover .pub strong{color:#e9e6e0;font-weight:600;font-size:15px;display:block;margin-top:3px}

/* TOC page */
.toc{height:100%;padding:46px 50px 32px;display:flex;flex-direction:column;color:var(--ink);background:var(--paper)}
.toc .eb{font-size:13px;letter-spacing:.18em;color:var(--accent);font-weight:600}
.toc h2{font-family:var(--f-display);font-size:38px;font-weight:900;margin:8px 0 4px}

.toc a.row:last-of-type{border-bottom:1px solid var(--paper-line)}
.toc .sec{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.03em}
.toc .ttl{font-family:var(--f-display);font-size:17.5px;font-weight:700;line-height:1.42;text-wrap:balance;grid-column:1}
.toc .sum{font-size:13px;color:var(--ink-2);line-height:1.6;grid-column:1}
.toc .pg{grid-column:2;grid-row:1/4;align-self:center;font-family:var(--f-display);font-size:30px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums}
.toc a.row:hover .pg{color:var(--accent)}
.toc .note{margin-top:auto;font-size:12.5px;color:var(--ink-3);line-height:1.6}

/* End leaf */
.endleaf{height:100%;background:var(--paper);display:flex;align-items:flex-end;justify-content:center;padding-bottom:60px}

/* Zoom overlay */
.zoom{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--desk) 94%,transparent);backdrop-filter:blur(4px);overflow:auto;

.zoom img{width:100%;height:auto;display:block;box-shadow:var(--shadow);background:#fff;filter:brightness(var(--page-dim))}
.zoom .close{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:21}

  const cover=document.createElement("div"); cover.className="page hard"; cover.dataset.density="hard";
  cover.innerHTML=`<div class="frame"><div class="cover" style="--photo-h:${ISSUE.articles.filter(a=>!a.news).length>4?320:400}px">
    <div class="photo"><div class="mast"><span>MONTHLY BRIEF<br>${ISSUE.date}</span><b>${ISSUE.vol}</b></div><h1>THE ISSUE</h1></div>
    <div class="tag">전문대학 및 고등직업교육 동향과 현안에 관한 소식을 전합니다.</div>
    <ol>${ISSUE.articles.filter(a=>!a.news).map(a=>`<li><em>${esc(a.sec.replace(/^2026 전문대학 /,""))}</em><span>${esc(a.title)}</span></li>`).join("")}</ol>
    <div class="pub"><div>한국전문대학교육협의회 부설<strong>한국고등직업교육연구소</strong></div><div>KCCE</div></div>
  </div></div>`;
  els.push(cover);

  const toc=document.createElement("div"); toc.className="page";
  toc.innerHTML=`<div class="frame"><div class="toc">
    <div class="eb">CONTENTS</div><h2>이번 호 차례</h2>
    <p class="lead">THE ISSUE는 한국고등직업교육연구소가 매월 발간하는 정책 브리프입니다. 고등직업교육 정책의 흐름을 짚고, 전문대학 현장이 준비할 과제를 정리해 전합니다.</p>
    ${ISSUE.articles.map((a,i)=>`<a class="row" data-go="${bookIdx(a.start)}" href="#${a.id}"><span class="sec">${esc(a.sec)}</span><span class="ttl">${esc(a.title)}</span><span class="sum">${esc(a.sum)}</span><span class="pg">${String(a.start).padStart(2,"0")}</span></a>`).join("")}
    <div class="note">기사를 누르면 해당 쪽으로 이동합니다. 상단 ‘바로가기’에서도 기사를 고를 수 있습니다.</div>
  </div></div>`;
  els.push(toc);

  ISSUE.pages.forEach((src,i)=>{
    const p=document.createElement("div"); p.className="page";
    p.innerHTML=`<div class="ph" style="background-image:url('${thumbOf(src)}')"></div><img class="full" data-n="${i}" alt="THE ISSUE ${ISSUE.vol} 본문 ${i+1}쪽" draggable="false">`;
    els.push(p);
  });

  if(FILL){ const f=document.createElement("div"); f.className="page blank"; f.innerHTML=`<div class="frame"><div class="endleaf"><span>THE ISSUE ${ISSUE.vol}</span></div></div>`; els.push(f); }
  const back=document.createElement("div"); back.className="page hard"; back.dataset.density="hard";
  back.innerHTML=`<div class="frame"><div class="back">
    <h3>THE ISSUE</h3>
    <p class="m">고등교육정책 동향과 연구소 소식을 매월 전하는 한국고등직업교육연구소의 정기 간행물입니다.</p>
    <div class="cg">THE ISSUE 편집위원회</div>
    <dl><dt>위원장</dt><dd>이병규 (한국고등직업교육연구소장)</dd>
        <dt>위원</dt><dd>백인철 (신성대학교 교수)<br>주홍석 (인덕대학교 교수)</dd>
        <dt>간사</dt><dd>김유리 (한국고등직업교육연구소 선임전문관)</dd></dl>
    <dl class="ct"><dt>발행</dt><dd>한국전문대학교육협의회 부설 한국고등직업교육연구소</dd>
        <dt>발행일</dt><dd>${ISSUE.pubDate}</dd>
        <dt>주소</dt><dd>서울특별시 중구 서소문로 38 6F</dd>
        <dt>문의</dt><dd>hver@kcce.or.kr</dd></dl>
    <div class="end"><div class="logo"><img src="logo.png" alt="한국전문대학교육협의회 부설 한국고등직업교육연구소"></div>
      <small>COPYRIGHT © Korean Council For College University Education(KCCE). All rights reserved.</small></div>
  </div></div>`;
  els.push(back);
  return els;
}

/* ───────── 상태 ───────── */
let flip=null, cur=0, mode=store.get("ti-view")||"double";
const narrow=()=>window.innerWidth<760;

function folioOf(i){
  if(i===0) return "표지"; if(i===1) return "차례"; if(i===TOTAL-1) return "뒤표지";
  const n=i-CONTENT0+1; if(n>ISSUE.pages.length) return "속표지"; return `${n} / ${ISSUE.pages.length}쪽`;
}
function spreadOf(i){ // 두쪽 보기에서 함께 보이는 인덱스
  if(!flip || flip.getOrientation()==="portrait" || i===0 || i===TOTAL-1) return [i];
  const l = i%2===1 ? i : i-1; return [l,l+1].filter(x=>x>0&&x<TOTAL-1);
}
function articleAt(i){let a=null;ISSUE.articles.forEach(x=>{if(i>=bookIdx(x.start))a=x});return a}

function sync(i){
  cur=i; prioritize(i);
  const sp=spreadOf(i);
  $("#folio").textContent = sp.length>1 ? `${folioOf(sp[0]).replace(/ \/.*/,"")}–${folioOf(sp[1])}` : folioOf(i);
  $("#slider").value=i;
  $("#prev").disabled = i===0; $("#next").disabled = sp[sp.length-1]>=TOTAL-1;
  const st=ISSUE.articles.find(x=>sp.includes(bookIdx(x.start))&&x.start>1); const a=st||articleAt(sp[0]); $("#jump").value = i===0?"cover": (sp[0]===1&&!st)?"toc": a?a.id:"toc";
}

function layout(){
  const st=$("#stage"), cs=getComputedStyle(st);
  const W=st.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-(narrow()?0:110);
  const H=st.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const double = mode==="double" && !narrow();
  let h=H, w=h*RATIO;
  const cols=double?2:1;
  if(w*cols>W){w=W/cols;h=w/RATIO}
  return {w:Math.floor(w),h:Math.floor(h),double};
}

function init(startAt){
  const host=$("#stage");
  if(flip){try{flip.destroy()}catch(e){} flip=null}
  host.querySelectorAll("#book").forEach(b=>b.remove());
  const book=document.createElement("div"); book.id="book";
  host.insertBefore(book,$("#next"));
  const {w,h,double}=layout();
  book.style.width=(double?w*2:w)+"px"; book.style.height=h+"px";
  document.documentElement.style.setProperty("--s",(w/620).toFixed(4));
  flip=new St.PageFlip(book,{
    width:w,height:h,size:"fixed",showCover:true,usePortrait:!double,
    maxShadowOpacity:.45,flippingTime:750,mobileScrollSupport:false,showPageCorners:true,
    startPage:startAt||0,drawShadow:true,autoSize:false
  });
  flip.loadFromHTML(buildPages());
  bindImgs(book);
  flip.on("flip",e=>sync(e.data));
  flip.on("changeOrientation",()=>sync(flip.getCurrentPageIndex()));
  // 차례 링크
  // 책 넘김 엔진이 누름을 '쪽 넘기기'로 가로채지 않도록 차례 항목에서는 누름 이벤트를 막고, 클릭으로 해당 쪽 이동
  book.querySelectorAll("[data-go]").forEach(a=>{
    ["mousedown","touchstart","pointerdown"].forEach(t=>a.addEventListener(t,ev=>ev.stopPropagation(),{passive:true}));
    a.addEventListener("click",ev=>{ev.preventDefault();ev.stopPropagation();go(+a.dataset.go)});
  });
  sync(flip.getCurrentPageIndex());
  setViewButtons();
}

/* ───────── 쪽 이미지 로딩: 미리보기(작은 이미지) 먼저, 지금 펼친 쪽부터 원본 순서대로 ───────── */
const thumbOf = src => src.replace(/\/p(\d+)\.jpg/, "/s/p$1.jpg");
const LOADED=new Set(); let IMGS=[], queue=[], active=0;
function bindImgs(root){
  IMGS=[]; root.querySelectorAll("img.full").forEach(im=>{const n=+im.dataset.n; IMGS[n]=im;
    if(LOADED.has(n)){ im.src=ISSUE.pages[n]; im.classList.add("on"); }});
}
function pump(){
  while(active<4 && queue.length){
    const n=queue.shift(), im=IMGS[n]; if(!im||im.getAttribute("src")) continue;
    active++; const done=()=>{active--; LOADED.add(n); im.classList.add("on"); pump();};
    im.onload=done; im.onerror=()=>{active--; pump();}; im.src=ISSUE.pages[n];
  }
}
function prioritize(bookI){
  const n0=Math.max(0,Math.min(ISSUE.pages.length-1,bookI-CONTENT0)), order=[];
  for(let d=0; d<ISSUE.pages.length; d++){ [n0+d,n0-d].forEach(x=>{ if(x>=0&&x<ISSUE.pages.length&&!order.includes(x)) order.push(x); }); }
  queue=order; pump();
}

function go(i){ if(!flip) return; i=Math.max(0,Math.min(TOTAL-1,i));
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(spreadOf(cur).includes(i)) return;
  if(reduce){ flip.turnToPage(i); sync(i); } else flip.flip(i);
}

/* ───────── 컨트롤 ───────── */
function fillJump(){
  const s=$("#jump");
  s.innerHTML=`<option value="cover">표지</option><option value="toc">차례</option>`+
    ISSUE.articles.map(a=>`<option value="${a.id}">${String(a.start).padStart(2,"0")}쪽 · ${esc(a.sec)}</option>`).join("");
  s.addEventListener("change",()=>{const v=s.value; go(v==="cover"?0:v==="toc"?1:bookIdx(ISSUE.articles.find(a=>a.id===v).start))});
}
function setViewButtons(){
  const n=narrow(); $("#v2").disabled=n; $("#v2").title=n?"화면이 좁아 한쪽 보기로 표시됩니다":"두쪽 보기";
  const single = mode==="single"||n;
  $("#v1").setAttribute("aria-pressed",single); $("#v2").setAttribute("aria-pressed",!single);
}
$("#v1").onclick=()=>{mode="single";store.set("ti-view",mode);init(cur)};
$("#v2").onclick=()=>{mode="double";store.set("ti-view",mode);init(cur)};

function applyTheme(t){
  const sys=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  const eff=t||document.documentElement.dataset.theme||sys;
  if(t) document.documentElement.dataset.theme=t;
  $("#tl").setAttribute("aria-pressed",eff==="light"); $("#td").setAttribute("aria-pressed",eff==="dark");
}
$("#tl").onclick=()=>{applyTheme("light");store.set("theissue-theme","light")};
$("#td").onclick=()=>{applyTheme("dark");store.set("theissue-theme","dark")};

$("#prev").onclick=()=>flip&&flip.flipPrev();
$("#next").onclick=()=>flip&&flip.flipNext();
const sl=$("#slider"); sl.max=TOTAL-1; sl.addEventListener("input",()=>{flip.turnToPage(+sl.value);sync(+sl.value)});
document.addEventListener("keydown",e=>{
  if(!$("#zoom").hidden){ if(e.key==="Escape") closeZoom(); return; }
  if(e.target.matches("select,input")) return;
  if(e.key==="ArrowRight"||e.key==="PageDown") flip.flipNext();
  if(e.key==="ArrowLeft"||e.key==="PageUp") flip.flipPrev();
  if(e.key==="Home") go(0); if(e.key==="End") go(TOTAL-1);
});

/* 크게 보기: 현재 펼친 쪽 원본 이미지를 세로 스크롤로 */
function openZoom(){
  const imgs=spreadOf(cur).filter(i=>i>=CONTENT0&&i<CONTENT0+ISSUE.pages.length);
  const w=$("#zoomWrap");
  w.innerHTML = imgs.length ? imgs.map(i=>`<img src="${ISSUE.pages[i-CONTENT0]}" alt="본문 ${i-CONTENT0+1}쪽">`).join("")
    : `<div class="msg">표지·차례는 책 화면에서 바로 보실 수 있습니다. 본문 쪽에서 눌러 주세요.</div>`;
  $("#zoom").hidden=false; $("#zoom").scrollTop=0; $("#zoomClose").focus();
}
function closeZoom(){$("#zoom").hidden=true;$("#zoomBtn").focus()}
$("#zoomBtn").onclick=openZoom; $("#zoomClose").onclick=closeZoom;
$("#zoom").addEventListener("click",e=>{if(e.target.id==="zoom")closeZoom()});

let rt; let lastNarrow=narrow();
addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{lastNarrow=narrow();init(cur)},180)});

/* 시작 */
fillJump();
applyTheme(store.get("theissue-theme"));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>applyTheme());
function startFromHash(){
  const h=location.hash.slice(1);
  const a=ISSUE.articles.find(x=>x.id===h); if(a) return bookIdx(a.start);
  const m=h.match(/^p(\d+)$/); if(m) return bookIdx(Math.min(+m[1],ISSUE.pages.length));
  if(h==="toc") return 1; return 0;
}
if(window.St) init(startFromHash());
else $("#stage").innerHTML='<p style="color:var(--ink-2)">책 넘김 기능을 불러오지 못했습니다. 새로고침해 주세요.</p>';
</script>
